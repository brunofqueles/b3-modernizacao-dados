# Definicao do Job "pipeline_diario_b3"
#
# Este arquivo e uma exportacao (via "View as code" no Databricks Jobs UI)
# da configuracao real do Job em producao, incluindo as 7 tasks (ingestao,
# bronze, silver, gold, reconciliacao, alerta_divergencia, auditoria_execucoes),
# suas dependencias, agendamento (17:15, dias uteis, America/Sao_Paulo) e
# notificacao de falha e duracao por e-mail (2 enderecos, com propositos
# distintos - ver ADR-12).
#
# Todas as 7 tasks passam o Parameter modo_execucao=agendado explicitamente.
# Essa correcao (04/09) resolveu uma inconsistencia real: 4 notebooks
# (silver, gold, reconciliacao, auditoria_execucoes) nao tinham Widget de
# modo_execucao e gravavam "reprocessamento_manual" fixo no codigo mesmo
# quando disparados pelo Job; e a task "bronze" nunca teve o Parameter
# configurado, funcionando apenas porque o valor padrao do seu Widget
# coincidia com "agendado" - nao por configuracao correta.
#
# A task "reconciliacao" compara Gold vs. KNIME automaticamente para o dia
# anterior (D-1), detectado dinamicamente a partir da ultima data disponivel
# na gold.indice_proxy — nao depende de calendario fixo. Ver ADR-10.
#
# A task "alerta_divergencia" e aditiva: le o resultado ja gravado pela task
# "reconciliacao" e dispara um e-mail apenas quando a divergencia entre KNIME
# e Databricks ultrapassa um limiar de anormalidade (1%). Ver ADR-13.
#
# A task "auditoria_execucoes" detecta automaticamente padroes de execucao que
# merecem explicacao (execucoes proximas, gaps, duracao anormal), gravando em
# tabelas proprias com insercao apenas de registros novos (preserva qualquer
# causa raiz anotada manualmente apos investigacao humana). Ver ADR-15.
#
# Proposito: versionamento e documentacao viva da orquestracao do pipeline,
# servindo como primeiro passo em direcao a uma futura adocao de Databricks
# Asset Bundles (IaC) — ver architecture.md, secao de Evolucao — onde este
# mesmo formato YAML seria a fonte de verdade "deployada" via comando
# (databricks bundle deploy), em vez de configurado manualmente pela interface.
#
# Este arquivo e uma copia de referencia: alteracoes feitas aqui NAO sao
# aplicadas automaticamente ao Job real — a edicao continua sendo feita
# pela interface do Databricks Jobs, e este arquivo deve ser reexportado
# e commitado sempre que a configuracao do Job mudar.

resources:
  jobs:
    pipeline_diario_b3:
      name: pipeline_diario_b3
      description: "Pipeline diario do projeto B3. Orquestra as 4 tasks do fluxo
        completo: ingestao (Landing), Bronze, Silver, Gold. Agendado apos o
        fechamento do pregao (17:15)."
      email_notifications:
        on_failure:
          - bruno.queles.dataeng@gmail.com
          - bruno.quelestech@outlook.com
        on_duration_warning_threshold_exceeded:
          - bruno.queles.dataeng@gmail.com
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 300
      schedule:
        quartz_cron_expression: 0 15 17 ? * MON-FRI
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: ingestao_landing
